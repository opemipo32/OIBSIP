<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Title Card — Task 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B1B2F;
    --amber: #E8A33D;
    --teal: #3E7C8A;
    --gray: #9A9AAE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: var(--ink);
    font-family: "Inter", sans-serif;
    overflow: hidden;
  }
  .card {
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    position: relative;
  }
  .eyebrow {
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 28px;
  }
  .name {
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 6vw, 4.2rem);
    color: #fff;
    margin-bottom: 22px;
    line-height: 1.1;
  }
  .meta {
    font-size: clamp(1.1rem, 2.4vw, 1.4rem);
    color: var(--gray);
    font-weight: 500;
    margin-bottom: 34px;
  }
  .task-badge {
    display: inline-block;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(1.3rem, 3vw, 1.9rem);
    color: var(--ink);
    background: var(--amber);
    padding: 16px 40px;
    border-radius: 999px;
    letter-spacing: 0.01em;
  }
  .frame {
    position: absolute;
    inset: 28px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="frame"></div>
  <p class="eyebrow">Project Demo</p>
  <h1 class="name">Ajayi Andrew Opemipo</h1>
  <p class="meta">Track: Web Development</p>
  <div class="task-badge">TASK 3 · Temperature Converter Website</div>
</div>
</body>
</html>
